        <style>

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 26px;
        letter-spacing: 0.5px;
        display: none;
        margin: 70px 0 0 0;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
        </style>
    </head>
